<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>챗봇</title>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #f4f7fe;
      font-family: 'Noto Sans KR', sans-serif;
    }

    .chat-container {
      max-width: 450px;
      height: 700px;
      margin: 40px auto;
      background-color: #ffffff;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .chat-header {
      background-color: #556ee6;
      color: #fff;
      padding: 18px;
      text-align: center;
      font-size: 20px;
      font-weight: 600;
    }

    .chat-messages {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
      background-color: #f4f7fe;
    }

    .message {
      display: flex;
      margin-bottom: 15px;
    }

    .message.user {
      justify-content: flex-end;
    }

    .message.bot {
      justify-content: flex-start;
    }

    .bubble {
      max-width: 75%;
      padding: 12px 18px;
      border-radius: 20px;
      font-size: 15px;
      line-height: 1.6;
      box-shadow: 0 2px 6px rgba(0,0,0,0.08);
    }

    .user .bubble {
      background: linear-gradient(to right, #84fab0, #8fd3f4);
      color: #000;
      border-bottom-right-radius: 4px;
    }

    .bot .bubble {
      background: #e2e8f0;
      color: #333;
      border-bottom-left-radius: 4px;
    }

    .profile-icon {
      width: 32px;
      height: 32px;
      background-color: #cbd5e1;
      border-radius: 50%;
      margin-right: 10px;
    }

    .chat-input {
      display: flex;
      border-top: 1px solid #ccc;
      padding: 14px;
      background-color: #ffffff;
    }

    #user-input {
      flex: 1;
      padding: 10px 15px;
      border: 1px solid #ccc;
      border-radius: 20px;
      font-size: 14px;
      outline: none;
    }

    #send-btn {
      margin-left: 10px;
      padding: 10px 20px;
      background-color: #556ee6;
      color: #fff;
      font-weight: bold;
      border: none;
      border-radius: 20px;
      cursor: pointer;
      transition: background 0.2s ease-in-out;
    }

    #send-btn:hover {
      background-color: #4455cc;
    }
  </style>
</head>
<body>
  <div class="chat-container">
    <div class="chat-header">챗봇</div>
    <div class="chat-messages" id="chat-messages"></div>
    <form class="chat-input" id="chat-form">
      <input type="text" id="user-input" placeholder="메시지를 입력하세요..." autocomplete="off" />
      <button type="submit" id="send-btn">전송</button>
    </form>
  </div>

  <script>
    $(function () {
      $("#chat-form").submit(function (e) {
        e.preventDefault();
        const message = $("#user-input").val().trim();
        if (!message) return;

        appendMessage('user', message);
        $("#user-input").val("");
        scrollToBottom();

        $.ajax({
          url: "/chat",
          method: "POST",
          contentType: "application/json",
          data: JSON.stringify({ "userMsg": message }),
          success: function (res) {
            appendMessage('bot', res || "응답이 없습니다.");
            scrollToBottom();
          },
          error: function () {
            appendMessage('bot', "⚠️ 서버 오류 발생");
            scrollToBottom();
          }
        });
      });

      function appendMessage(type, text) {
        const bubble = `
          <div class="message ${type}">
            ${type === 'bot' ? '<div class="profile-icon"></div>' : ''}
            <div class="bubble">${escapeHtml(text)}</div>
          </div>`;
        $("#chat-messages").append(bubble);
      }

      function scrollToBottom() {
        const chatBox = $("#chat-messages");
        chatBox.scrollTop(chatBox[0].scrollHeight);
      }

      function escapeHtml(text) {
        return text.replace(/[&<>"']/g, function (m) {
          return ({
            '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;'
          })[m];
        });
      }
    });
  </script>
</body>
</html>
