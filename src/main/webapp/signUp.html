<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>회원가입</title>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background-color: #f4f4f4;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .signup-container {
      background-color: #fff;
      padding: 40px 30px;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
      width: 350px;
    }

    .signup-container h2 {
      text-align: center;
      margin-bottom: 30px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      margin-bottom: 8px;
    }

    .form-group input {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 14px;
    }

    .signup-btn {
      width: 100%;
      padding: 12px;
      background-color: #111827;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      font-size: 15px;
    }
    
    .signup-btn:disabled {
      background-color: #ccc;
      cursor: not-allowed;
      color: #666;
    }

    .signup-btn:hover {
      background-color: #1f2937;
    }

    .login-link {
      text-align: center;
      margin-top: 15px;
      font-size: 14px;
    }

    .login-link a {
      color: #1d4ed8;
      text-decoration: none;
    }

    .error-message {
      font-size: 13px;
      text-align: center;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <div class="signup-container">
    <h2>회원가입</h2>
    <form id="signup-form">
      <div class="form-group">
        <label for="id">아이디</label>
        <input type="text" id="id" placeholder="아이디를 입력하세요" />
      </div>
      <div class="form-group">
        <label for="email">이메일</label>
        <input type="email" id="email" placeholder="example@email.com" />
      </div>
      <div class="form-group">
        <label for="pw">비밀번호</label>
        <input type="password" id="pw" placeholder="비밀번호를 입력하세요" />
      </div>
      <div class="form-group">
        <label for="pw2">비밀번호 확인</label>
        <input type="password" id="pw2" placeholder="비밀번호를 다시 입력하세요" />
      </div>
      <button class="signup-btn" type="submit">회원가입</button>
      <div class="login-link">
        이미 계정이 있으신가요? <a href="login.html">로그인</a>
      </div>
      <div class="error-message" id="errorMsg"></div>
    </form>
  </div>

  <script>
    let isIdValid = false;

    $(function () {
   	  // 초기에는 버튼 비활성화
   	  $(".signup-btn").prop("disabled", true);
   	
      // 아이디 입력창 blur 시 중복검사
      $("#id").on("blur", function () {
        const id = $(this).val().trim();
        const errorMsg = $("#errorMsg");
        if (!id) {
          isIdValid = false;
          $(".signup-btn").prop("disabled", true);  // 버튼 비활성화
          return;
        }

        $.ajax({
        	  url: "/checkId/" + $('#id').val(),
        	  method: "GET",
        	  success: function (result) {
        	    if (result === true) {
        	      isIdValid = true;
        	      errorMsg.text("✅ 사용 가능한 아이디입니다.").css("color", "green");
        	      $(".signup-btn").prop("disabled", false);  // 버튼 활성화
        	    } else {
        	      isIdValid = false;
        	      errorMsg.text("❌ 이미 사용 중인 아이디입니다.").css("color", "red");
        	      $(".signup-btn").prop("disabled", true);  // 버튼 비활성화
        	    }
        	  },
        	  error: function () {
        	    isIdValid = false;
        	    errorMsg.text("⚠️ 중복 검사 중 오류가 발생했습니다.").css("color", "red");
        	    $(".signup-btn").prop("disabled", true);  // 버튼 비활성화
        	  }
        	});
      });

      // 회원가입 폼 제출
      $("#signup-form").submit(function (e) {
        e.preventDefault();
        const id = $("#id").val().trim();
        const email = $("#email").val().trim();
        const pw = $("#pw").val();
        const pw2 = $("#pw2").val();
        const errorMsg = $("#errorMsg");

        if (!id || !email || !pw || !pw2) {
          errorMsg.text("모든 항목을 입력해주세요.").css("color", "red");
          return;
        }

        if (!isIdValid) {
          errorMsg.text("아이디 중복검사를 완료해주세요.").css("color", "red");
          return;
        }

        if (pw !== pw2) {
          errorMsg.text("비밀번호가 일치하지 않습니다.").css("color", "red");
          return;
        }

        $.ajax({
          url: "/signUp",
          method: "POST",
          contentType: "application/json",
          data: JSON.stringify({
            id: id,
            email: email,
            pw: pw
          }),
          success: function () {
            alert("회원가입이 완료되었습니다! 로그인 페이지로 이동합니다.");
            window.location.href = "/login.html";
          },
          error: function (xhr) {
            if (xhr.responseJSON && xhr.responseJSON.message) {
              errorMsg.text(xhr.responseJSON.message).css("color", "red");
            } else {
              errorMsg.text("⚠️ 회원가입에 실패했습니다.").css("color", "red");
            }
          }
        });
      });
    });
  </script>
</body>
</html>
